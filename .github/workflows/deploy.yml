name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw clean verify

      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve backend Web App name by tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: resolve
        run: |
          APP_NAME=$(az webapp list --resource-group fbarryRG --query "[?tags.composant=='backend'].name" -o tsv)
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve.outputs.app_name }}
          package: target/azure-quiz-backend-0.0.1-SNAPSHOT.jar