name: Container & IaC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Trivy misconfig scan (Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Build Docker image
        run: docker build -t azure-quiz-backend:ci-scan .

      - name: Trivy image scan (CVE)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: azure-quiz-backend:ci-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'